# GitHub Workflow for Flutter APK Build
# This workflow builds and releases Flutter APKs on GitHub Actions

name: Flutter APK Build

on:
  workflow_dispatch:      # Manual trigger via GitHub UI
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
          cache-key: "flutter-${{ runner.os }}-${{ inputs.channel }}-${{ inputs.flutter-version }}-${{ runner.arch }}"
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run dart format
        run: dart format --output=none .

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test --no-pub
        working-directory: ${{ github.workspace }}

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build Debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # Optional: Release job for tag pushes
  release:
    name: Create Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-release.apk
          generate_release_notes: true