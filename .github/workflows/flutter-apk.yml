name: Flutter APK Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable
          cache: true
          architecture: X64

      - name: Create local.properties
        run: |
          # The Flutter action installs SDK at this path
          FLUTTER_SDK="/opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "flutter.versionCode=${{ github.run_number }}" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          cat android/local.properties

      - name: Precache Flutter engine artifacts
        run: |
          flutter precache --android --force
          echo "=== Flutter SDK bin cache ==="
          ls -la /opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter/bin/cache/artifacts/engine/ || echo "No engine cache found"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build Debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # Optional: Release job for tag pushes
  release:
    name: Create Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-release.apk
          generate_release_notes: true