buildscript {
    ext.kotlin_version = '2.0.0'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Add local Flutter engine artifacts as repository
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
        // Local Flutter engine artifacts from precache
        def flutterSdk = "/opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter"
        def engineCache = file("${flutterSdk}/bin/cache/artifacts/engine")
        if (engineCache.exists()) {
            flatDir {
                dirs engineCache
            }
        }
    }
}